<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="maroonGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#800020"/>
      <stop offset="100%" stop-color="#4A0012"/>
    </linearGradient>
    <linearGradient id="sacredGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Aura Circle -->
  <circle cx="60" cy="60" r="56" fill="url(#goldGlow)"/>
  
  <!-- Outer Sacred Ring -->
  <circle cx="60" cy="60" r="48" fill="url(#maroonGold)" stroke="#D97706" stroke-width="2"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#FDE68A" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Shirdi Temple Crown / Kalash & Diya Motif -->
  <!-- Lotus Petals Base -->
  <path d="M 40 76 C 50 84, 70 84, 80 76 C 75 70, 45 70, 40 76 Z" fill="url(#sacredGold)"/>
  <path d="M 48 74 C 54 80, 66 80, 72 74 C 68 68, 52 68, 48 74 Z" fill="#FEF3C7"/>

  <!-- Sacred Diya / Kalash Silhouette -->
  <path d="M 46 64 C 46 54, 52 48, 60 48 C 68 48, 74 54, 74 64 C 74 70, 68 74, 60 74 C 52 74, 46 70, 46 64 Z" fill="url(#sacredGold)"/>
  
  <!-- Divine Flame (Jyoti) -->
  <path d="M 60 30 C 65 38, 67 44, 60 48 C 53 44, 55 38, 60 30 Z" fill="#FBBF24"/>
  <path d="M 60 34 C 63 39, 64 43, 60 46 C 56 43, 57 39, 60 34 Z" fill="#FFFBEB"/>

  <!-- Sacred Om / Shirdi Inscription Symbol -->
  <text x="60" y="65" font-family="'Devanagari MT', 'Mangal', 'Noto Sans Devanagari', sans-serif" font-size="14" font-weight="900" fill="#800020" text-anchor="middle">ॐ</text>

  <!-- Sacred Arc Text -->
  <text x="60" y="98" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#D97706" text-anchor="middle" letter-spacing="1.5">SHIRDI</text>
</svg>
