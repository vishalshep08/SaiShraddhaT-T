    <rect x="180" y="130" width="60" height="60" rx="4" fill="url(#glassTempo)"/>
    <rect x="250" y="130" width="60" height="60" rx="4" fill="url(#glassTempo)"/>
    <rect x="320" y="130" width="60" height="60" rx="4" fill="url(#glassTempo)"/>
    <path d="M 390 130 L 460 148 C 465 150, 460 190, 450 190 L 390 190 Z" fill="url(#glassTempo)"/>
    
    <path d="M 495 185 L 520 190 C 523 195, 523 205, 515 208 L 490 200 Z" fill="#FBBF24"/>
    <path d="M 85 195 L 95 195 C 98 202, 98 215, 88 220 L 83 215 Z" fill="#EF4444"/>
    
    <!-- Wheels -->
    <circle cx="180" cy="250" r="34" fill="#0F172A"/>
    <circle cx="180" cy="250" r="20" fill="#CBD5E1"/>
    <circle cx="180" cy="250" r="10" fill="#475569"/>
    
    <circle cx="415" cy="250" r="34" fill="#0F172A"/>
