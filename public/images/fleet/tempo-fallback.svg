    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <rect width="600" height="340" rx="24" fill="url(#bgGrad4)"/>
  
  <circle cx="530" cy="70" r="45" fill="#D97706" fill-opacity="0.06"/>
  <text x="530" y="74" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#D97706" text-anchor="middle" letter-spacing="0.5">ON REQUEST</text>
  
  <ellipse cx="300" cy="275" rx="230" ry="18" fill="#000" fill-opacity="0.12"/>
  
  <g filter="url(#shadow4)">
