  <text x="40" y="55" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#1C1917" letter-spacing="-0.5">Tempo Traveller (13–26 Seater)</text>
  <text x="40" y="78" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#B45309">13 to 26 Seats • Pushback Luxury Seats • Large Group Yatra</text>
