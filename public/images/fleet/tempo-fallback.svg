    <path d="M 80 230 C 80 160, 85 125, 105 120 L 415 120 L 485 145 C 515 155, 525 180, 525 210 L 525 240 C 525 250, 515 255, 500 255 L 440 255 C 435 228, 395 228, 390 255 L 205 255 C 200 228, 160 228, 155 255 L 90 255 C 80 255, 80 245, 80 235 Z" fill="url(#carBodyTempo)"/>
    
