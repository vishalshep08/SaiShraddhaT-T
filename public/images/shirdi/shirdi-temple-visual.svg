<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <linearGradient id="shirdiBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="50%" stop-color="#F7F3EB"/>
      <stop offset="100%" stop-color="#EDE4D3"/>
    </linearGradient>
    <linearGradient id="templeGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="maroonArch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#800020"/>
      <stop offset="100%" stop-color="#4A0012"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FDE68A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Frame -->
  <rect width="640" height="400" rx="28" fill="url(#shirdiBg)"/>

  <!-- Morning Shirdi Sun Glow -->
  <circle cx="320" cy="180" r="160" fill="url(#sunGlow)"/>

  <!-- Shirdi Temple Spire (Shikhara) & Golden Kalash Silhouette -->
  <g transform="translate(190, 60)">
    <!-- Base Platform -->
    <rect x="20" y="240" width="220" height="20" rx="4" fill="#E2D9C8"/>
    <rect x="40" y="220" width="180" height="20" rx="3" fill="#D6CAAF"/>
    <rect x="60" y="190" width="140" height="30" rx="3" fill="#C5B695"/>

    <!-- Main Spire Tier 1 -->
    <path d="M 75 190 L 110 90 L 150 90 L 185 190 Z" fill="url(#templeGold)"/>
    <!-- Main Spire Tier 2 -->
    <path d="M 95 90 L 118 40 L 142 40 L 165 90 Z" fill="url(#templeGold)"/>
    <!-- Golden Dome / Kalash Top -->
    <ellipse cx="130" cy="38" rx="14" ry="8" fill="#FDE68A"/>
    <circle cx="130" cy="24" r="7" fill="#F59E0B"/>
    <polygon points="130,10 134,22 126,22" fill="#FBBF24"/>
    <line x1="130" y1="10" x2="130" y2="4" stroke="#D97706" stroke-width="2"/>
    <circle cx="130" cy="3" r="2.5" fill="#FBBF24"/>

    <!-- Sacred Dhwaja (Saffron Temple Flag) -->
    <path d="M 130 8 L 158 16 L 130 24 Z" fill="#EA580C"/>
  </g>

  <!-- Holy Temple Darshan Arches -->
  <path d="M 60 360 L 60 220 C 60 160, 160 160, 160 220 L 160 360" fill="none" stroke="url(#maroonArch)" stroke-width="8"/>
  <path d="M 480 360 L 480 220 C 480 160, 580 160, 580 220 L 580 360" fill="none" stroke="url(#maroonArch)" stroke-width="8"/>

  <!-- Sacred Chant Heading -->
  <text x="320" y="340" font-family="'Devanagari MT', 'Mangal', 'Noto Sans Devanagari', sans-serif" font-size="22" font-weight="bold" fill="#800020" text-anchor="middle" letter-spacing="2">॥ ॐ साईं राम ॥</text>
  <text x="320" y="365" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#78350F" text-anchor="middle" letter-spacing="1">SAI ASHRAM (BHAKTA NIWAS) • SHIRDI SINCE 2014</text>
</svg>
